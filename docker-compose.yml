services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tripledger
      POSTGRES_USER: tripledger
      POSTGRES_PASSWORD: tripledger
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripledger -d tripledger"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tripledger:tripledger@db:5432/tripledger
      UPLOAD_DIR: /app/uploads
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_MODE: ${AI_MODE:-mock}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      POLICY_AGENT_URL: ${POLICY_AGENT_URL:-http://host.docker.internal:8001}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-10}
      RECEIPT_EXTRACTION_MODE: ${RECEIPT_EXTRACTION_MODE:-local}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
    ports: ["8080:8000"]
    volumes: ["uploads:/app/uploads"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on: [api]
volumes:
  pgdata:
  uploads:
