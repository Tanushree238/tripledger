x-build-args: &build-args
  REGISTRY: ${REGISTRY:-}
  PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}

services:
  db:
    image: ${REGISTRY:-}postgres:16-alpine
    environment:
      POSTGRES_DB: tripledger
      POSTGRES_USER: tripledger
      POSTGRES_PASSWORD: tripledger
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripledger -d tripledger"]
      interval: 5s
      timeout: 5s
      retries: 10
  policy-agent:
    build:
      context: ./policy-agent
      args: *build-args
    environment:
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-small-en-v1.5}
    ports: ["8001:8001"]
    volumes: ["chroma:/app/data/chroma_db"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  api:
    build:
      context: ./backend
      args: *build-args
    environment:
      DATABASE_URL: postgresql+psycopg://tripledger:tripledger@db:5432/tripledger
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_MODE: ${AI_MODE:-mock}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      POLICY_AGENT_URL: ${POLICY_AGENT_URL:-http://policy-agent:8001}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-10}
      RECEIPT_EXTRACTION_MODE: ${RECEIPT_EXTRACTION_MODE:-local}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
    ports: ["8080:8000"]
    volumes: ["uploads:/app/uploads"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args: *build-args
    ports: ["${WEB_PORT:-5173}:5173"]
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on: [api]
volumes:
  pgdata:
  uploads:
  chroma:
