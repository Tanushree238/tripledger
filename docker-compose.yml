services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tripledger
      POSTGRES_USER: tripledger
      POSTGRES_PASSWORD: tripledger
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripledger -d tripledger"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tripledger:tripledger@db:5432/tripledger
      UPLOAD_DIR: /app/uploads
    ports: ["8000:8000"]
    volumes: ["uploads:/app/uploads"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]
volumes:
  pgdata:
  uploads:
